[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nqbreakout"
version = "0.1.0"
description = "NQ intraday breakout strategy: backtest, Apex Trader Funding evaluation simulator, statistical validation."
requires-python = ">=3.10"
authors = [{ name = "Giovanni Brusco" }]
dependencies = [
    "numpy>=1.25",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "pyarrow>=14.0",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.4",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbconvert>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (run with RUN_SLOW=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM"]
ignore = ["E501"]
